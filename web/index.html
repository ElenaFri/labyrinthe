<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Labyrinthe</title>
  <link rel="icon" href="res/icon.png" />
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 1rem;
    }
    #intro img { max-width: min(80vw, 480px); max-height: 45vh; border-radius: 8px; }
    #intro p { max-width: 36rem; margin: 0; color: #bbb; line-height: 1.4; }
    button {
      font-size: 1.3rem;
      padding: .6rem 1.6rem;
      border: 0;
      border-radius: 8px;
      background: #e8b63a;
      color: #222;
      cursor: pointer;
    }
    button:hover { background: #f5c94d; }
    #stage {
      position: fixed;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      visibility: hidden;
    }
    #toolbar {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 10;
      display: none;
      gap: 6px;
    }
    #toolbar button { font-size: 1rem; padding: .3rem .8rem; opacity: .75; }
    #toolbar button:hover { opacity: 1; }
    #end {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #111;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="intro">
    <img src="res/img/screens/labyrintheBox.jpg" alt="Boîte du jeu Labyrinthe" />
    <h1>Labyrinthe</h1>
    <p>
      Quatre joueurs, un plateau qui bouge : retrouvez vos trésors avant les autres !
      Le jeu est le programme Java original, exécuté dans votre navigateur
      (le premier chargement peut prendre un moment).
    </p>
    <button id="play">▶ Jouer</button>
    <p id="status"></p>
    <p><a href="doc/index.html" style="color:#e8b63a">Documentation (Javadoc)</a></p>
  </div>

  <div id="stage"></div>

  <div id="toolbar">
    <button id="mute" title="Couper ou remettre la musique">🔊 Musique</button>
  </div>

  <div id="end">
    <h2>Partie terminée</h2>
    <button id="replay">↻ Rejouer</button>
  </div>

  <audio id="music" src="music.mp3" loop preload="none"></audio>

  <script type="module">
    // Dimensions pour lesquelles l'interface du jeu a été dessinée.
    const GAME_WIDTH = 1920;
    const GAME_HEIGHT = 1080;

    const $ = (id) => document.getElementById(id);
    const music = $("music");
    const stage = $("stage");

    // Dossier de la page : CheerpJ expose la racine du serveur sous /app/, et
    // sur GitHub Pages le site est dans un sous-dossier (/<depot>/).
    const baseDir = location.pathname.replace(/[^/]*$/, "");
    const appDir = "/app" + baseDir;

    // Le jeu est dessiné pour 1920x1080 : on l'adapte à la fenêtre avec une
    // transformation CSS. CheerpJ calcule la position de la souris à partir des
    // rectangles et des coordonnées du navigateur, qui sont alors réduits ; on
    // les « dé-réduit » pour que Java voie des coordonnées à l'échelle 1:1.
    let scale = 1;
    let originX = 0;
    let originY = 0;

    const nativeRect = Element.prototype.getBoundingClientRect;
    Element.prototype.getBoundingClientRect = function () {
      const r = nativeRect.call(this);
      if (scale === 1 || !stage.contains(this)) return r;
      const x = (v) => (v - originX) / scale + originX;
      const y = (v) => (v - originY) / scale + originY;
      return new DOMRect(x(r.left), y(r.top), r.width / scale, r.height / scale);
    };

    for (const type of ["pointerdown", "pointermove", "pointerup", "mousedown", "mouseup", "mousemove", "click", "dblclick", "contextmenu", "wheel"]) {
      stage.addEventListener(type, (e) => {
        if (scale === 1 || e.rescaled) return;
        e.stopImmediatePropagation();
        e.preventDefault();
        const init = {
          bubbles: true, cancelable: true, composed: true, view: window,
          detail: e.detail, screenX: e.screenX, screenY: e.screenY,
          clientX: (e.clientX - originX) / scale + originX,
          clientY: (e.clientY - originY) / scale + originY,
          ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, altKey: e.altKey, metaKey: e.metaKey,
          button: e.button, buttons: e.buttons, relatedTarget: e.relatedTarget,
          deltaX: e.deltaX, deltaY: e.deltaY, deltaZ: e.deltaZ, deltaMode: e.deltaMode,
          pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: e.isPrimary,
          width: e.width, height: e.height, pressure: e.pressure,
        };
        const copy = type === "wheel" ? new WheelEvent(type, init)
          : type.startsWith("pointer") ? new PointerEvent(type, init)
          : new MouseEvent(type, init);
        copy.rescaled = true;
        e.target.dispatchEvent(copy);
      }, true);
    }

    function fitStage() {
      scale = Math.min(1, window.innerWidth / GAME_WIDTH, window.innerHeight / GAME_HEIGHT);
      originX = (window.innerWidth - GAME_WIDTH * scale) / 2;
      originY = (window.innerHeight - GAME_HEIGHT * scale) / 2;
      stage.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
    }

    $("mute").addEventListener("click", () => {
      if (music.paused) {
        music.play();
        $("mute").textContent = "🔊 Musique";
      } else {
        music.pause();
        $("mute").textContent = "🔇 Musique";
      }
    });
    $("replay").addEventListener("click", () => location.reload());

    $("play").addEventListener("click", async () => {
      $("play").disabled = true;
      $("status").textContent = "Chargement de Java…";

      // Le clic est le geste utilisateur qui autorise le son.
      music.play().catch(() => {});

      await cheerpjInit({
        version: 17,
        status: "none",
        javaProperties: ["labyrinth.base=" + appDir, "labyrinth.web=true"],
      });

      $("status").textContent = "Démarrage du jeu…";
      stage.style.width = GAME_WIDTH + "px";
      stage.style.height = GAME_HEIGHT + "px";
      cheerpjCreateDisplay(GAME_WIDTH, GAME_HEIGHT, stage);
      fitStage();
      window.addEventListener("resize", fitStage);

      $("intro").style.display = "none";
      stage.style.visibility = "visible";
      $("toolbar").style.display = "flex";

      await cheerpjRunJar(appDir + "labyrinthe.jar");

      // Le programme Java s'est terminé (bouton « Quitter »).
      music.pause();
      stage.style.display = "none";
      $("toolbar").style.display = "none";
      $("end").style.display = "flex";
    });
  </script>
</body>
</html>
