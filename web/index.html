<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Labyrinthe</title>
  <link rel="icon" href="res/icon.png" />
  <script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    #intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 1rem;
    }
    #intro img { max-width: min(80vw, 480px); max-height: 45vh; border-radius: 8px; }
    #intro p { max-width: 36rem; margin: 0; color: #bbb; line-height: 1.4; }
    button {
      font-size: 1.3rem;
      padding: .6rem 1.6rem;
      border: 0;
      border-radius: 8px;
      background: #e8b63a;
      color: #222;
      cursor: pointer;
    }
    button:hover { background: #f5c94d; }
    #stage {
      position: fixed;
      inset: 0;
      visibility: hidden;
    }
    #toolbar {
      position: fixed;
      right: 8px;
      bottom: 8px;
      z-index: 10;
      display: none;
      gap: 6px;
    }
    #toolbar button { font-size: 1rem; padding: .3rem .8rem; opacity: .75; }
    #toolbar button:hover { opacity: 1; }
    #end {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #111;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="intro">
    <img src="labyrintheBox.jpg" alt="Boîte du jeu Labyrinthe" />
    <h1>Labyrinthe</h1>
    <p>
      Quatre joueurs, un plateau qui bouge : retrouvez vos trésors avant les autres !
      Le jeu est le programme Java original, exécuté dans votre navigateur
      (le premier chargement peut prendre un moment).
    </p>
    <button id="play">▶ Jouer</button>
    <p id="status"></p>
    <p><a href="doc/index.html" style="color:#e8b63a">Documentation (Javadoc)</a></p>
  </div>

  <div id="stage"></div>

  <div id="toolbar">
    <button id="mute" title="Couper ou remettre la musique">🔊 Musique</button>
  </div>

  <div id="end">
    <h2>Partie terminée</h2>
    <button id="replay">↻ Rejouer</button>
  </div>

  <audio id="music" src="music.mp3" loop preload="none"></audio>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const music = $("music");
    const stage = $("stage");

    // Dossier de la page : CheerpJ expose la racine du serveur sous /app/, et
    // sur GitHub Pages le site est dans un sous-dossier (/<depot>/).
    const appDir = "/app" + location.pathname.replace(/[^/]*$/, "");

    $("mute").addEventListener("click", () => {
      if (music.paused) {
        music.play();
        $("mute").textContent = "🔊 Musique";
      } else {
        music.pause();
        $("mute").textContent = "🔇 Musique";
      }
    });
    $("replay").addEventListener("click", () => location.reload());

    $("play").addEventListener("click", async () => {
      $("play").disabled = true;
      $("status").textContent = "Chargement de Java…";

      // Le clic est le geste utilisateur qui autorise le son.
      music.play().catch(() => {});

      // Liste des parties du runtime Java dont le jeu a besoin (voir README, « Mettre à jour preload.json »)
      // : elles sont téléchargées en parallèle au lieu d'être demandées une à une.
      const preloadResources = await fetch("preload.json").then((r) => (r.ok ? r.json() : undefined), () => undefined);

      await cheerpjInit({
        version: 17,
        status: "none",
        javaProperties: ["labyrinth.web=true"],
        preloadResources,
      });

      $("status").textContent = "Démarrage du jeu…";
      cheerpjCreateDisplay(-1, -1, stage);

      $("intro").style.display = "none";
      stage.style.visibility = "visible";
      $("toolbar").style.display = "flex";

      await cheerpjRunJar(appDir + "labyrinthe.jar");

      // Le programme Java s'est terminé (bouton « Quitter »).
      music.pause();
      stage.style.display = "none";
      $("toolbar").style.display = "none";
      $("end").style.display = "flex";
    });
  </script>
</body>
</html>
