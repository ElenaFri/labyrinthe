name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compiler le jeu
        run: |
          mkdir -p build/classes
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d build/classes $(find src/main -name '*.java')

      - name: Polices et ffmpeg (tests d'affichage, conversion de la musique)
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-dejavu-core ffmpeg

      - name: Tests
        run: |
          mkdir -p build/test-classes
          curl -sSfL --retry 6 --retry-delay 10 --retry-all-errors -o build/junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar
          javac --release 17 -encoding UTF-8 -cp build/classes:build/junit.jar -d build/test-classes $(find src/test -name '*.java')
          java -jar build/junit.jar execute -cp build/classes:build/test-classes --scan-classpath build/test-classes

      - name: Empaqueter le jeu (avec ses images)
        run: |
          printf 'Main-Class: labyrinth.Labyrinth\n' > build/manifest.txt
          jar cfm build/labyrinthe.jar build/manifest.txt -C build/classes . res/img res/icon.png

      - name: Assembler le site
        run: |
          mkdir site
          cp web/index.html web/preload.json site/
          cp build/labyrinthe.jar site/
          cp res/img/screens/labyrintheBox.jpg res/icon.png site/
          javadoc -quiet -Xdoclint:all -Xwerror -d site/doc -sourcepath src/main -subpackages labyrinth -encoding UTF-8 -docencoding UTF-8 -charset UTF-8

      - name: Convertir la musique (wav de 130 Mo -> mp3)
        run: |
          ffmpeg -loglevel error -i res/snd/la_moldau.wav -b:a 96k site/music.mp3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
