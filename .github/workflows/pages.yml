name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compiler le jeu
        run: |
          mkdir -p build/classes
          javac --release 17 -encoding UTF-8 -d build/classes -sourcepath src/main src/main/labyrinth/Labyrinth.java
          printf 'Main-Class: labyrinth.Labyrinth\n' > build/manifest.txt
          jar cfm build/labyrinthe.jar build/manifest.txt -C build/classes .

      - name: Assembler le site
        run: |
          mkdir -p site/res
          cp web/index.html site/
          cp build/labyrinthe.jar site/
          cp -r res/img res/icon.png site/res/
          cp -r doc site/doc

      - name: Convertir la musique (wav de 130 Mo -> mp3)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -loglevel error -i res/snd/la_moldau.wav -b:a 96k site/music.mp3

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
